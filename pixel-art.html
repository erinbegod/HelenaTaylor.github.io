<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

 <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: 'Press Start 2P', cursive;
    }

footer {
      text-align: center;
      padding: 30px;
      font-size: 14px;
      color: #777;
    }


    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    
h3 {
  color: #FFB6C1;
}

    h1 {
      color: #FFD1DC;
      text-align: center;
      margin-bottom: 20px;
      font-size: 32px;
    }

    p {
      color: #ddd;
      text-align: center;
      line-height: 1.8;
      font-size: 12px;
      max-width: 900px;
      margin: 0 auto 40px;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 30px;
      color: black;
      background: #FFD1DC;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 12px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(250px, 1fr));
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 30px;
      display: block;
      background: #1a1a1a;
      image-rendering: pixelated;
     }

.divider {
  width: 90%;
  height: 3px;
  background: #FFB6C1;
  margin: 80px auto;
}

  </style>
</head>
<body>

    </p>

<div class="divider"></div>
